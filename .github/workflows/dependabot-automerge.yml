name: Dependabot native auto-merge

# Skrivande controller för ett mycket smalt undantag. pull_request_target kör
# alltid den betrodda default-branch-versionen av workflow och validator; PR-head
# checkas aldrig ut eller exekveras med skrivtoken. Samma namngivna token måste
# finnas som både Actions- och Dependabot-secret eftersom olika aktörer kan
# utlösa events för samma PR.
on:
  pull_request_target:
    branches: [preview]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, auto_merge_enabled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Require dedicated controller token
        id: auth
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPENDABOT_AUTOMERGE_TOKEN saknas; controllern skriver inget."
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Disarm previous request before validating a new head
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          auto_merge=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ "$auto_merge" = "true" ]; then
            gh pr merge "$PR_URL" --disable-auto
          fi

      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7
        with:
          github-token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}

      - name: Validate patch contents without executing PR code
        id: validate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
        run: node scripts/ci/dependabot-automerge.mjs

      - name: Reconcile native auto-merge
        if: always() && steps.auth.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          ELIGIBLE: ${{ steps.meta.outcome == 'success' && steps.validate.outcome == 'success' }}
        run: |
          if [ "$ELIGIBLE" = "true" ] && [ "$IS_DRAFT" != "true" ]; then
            gh pr merge "$PR_URL" --auto --squash --match-head-commit "$HEAD_SHA"
          else
            auto_merge=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
            if [ "$auto_merge" = "true" ]; then
              gh pr merge "$PR_URL" --disable-auto
            fi
            echo "Manuell review krävs (eligible=$ELIGIBLE, draft=$IS_DRAFT)."
          fi
