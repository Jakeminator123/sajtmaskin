<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">Nuvarande fil- och previewlivscykel</title>
  <desc id="desc">Prompten orkestreras och genereras i Vercel, sparas som kanonisk snapshot i Postgres och materialiseras separat för live preview och verifiering på Fly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
    <style>
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#0f172a}.h{font-size:30px;font-weight:600}.s{font-size:16px;fill:#475569}.l{font-size:18px;font-weight:600}.sm{font-size:14px;fill:#475569}.n{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.d{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.g{fill:#ecfdf5;stroke:#059669;stroke-width:2}.w{fill:#fffbeb;stroke:#d97706;stroke-width:2}.a{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="640" y="48" text-anchor="middle" class="t h">Nuvarande fil- och previewlivscykel</text>
  <text x="640" y="78" text-anchor="middle" class="t s">Kanonisk kod finns i Postgres; Fly-workspaces är härledda runtimekopior</text>

  <rect x="430" y="110" width="420" height="72" rx="14" class="n"/>
  <text x="640" y="142" text-anchor="middle" class="t l">Användarens prompt</text>
  <text x="640" y="165" text-anchor="middle" class="t sm">init eller follow-up</text>

  <rect x="430" y="220" width="420" height="82" rx="14" class="n"/>
  <text x="640" y="253" text-anchor="middle" class="t l">Vercel / Next-kontrollplan</text>
  <text x="640" y="278" text-anchor="middle" class="t sm">auth, brief, BuildSpec, kontrakt och source receipt</text>

  <rect x="430" y="342" width="420" height="82" rx="14" class="w"/>
  <text x="640" y="375" text-anchor="middle" class="t l">Kodmodell streamar kandidat</text>
  <text x="640" y="400" text-anchor="middle" class="t sm">kortlivat serverminne / SSE — ännu inte projektversion</text>

  <rect x="430" y="464" width="420" height="86" rx="14" class="g"/>
  <text x="640" y="497" text-anchor="middle" class="t l">Finalize och preflight</text>
  <text x="640" y="522" text-anchor="middle" class="t sm">autofix, syntax, import repair, merge och policy</text>

  <rect x="400" y="596" width="480" height="92" rx="20" class="d"/>
  <text x="640" y="631" text-anchor="middle" class="t l">Postgres: engine_versions.files_json</text>
  <text x="640" y="657" text-anchor="middle" class="t sm">kanonisk snapshot + versionId + filesRevision</text>

  <rect x="430" y="734" width="420" height="70" rx="14" class="n"/>
  <text x="640" y="776" text-anchor="middle" class="t l">Fly preview-host materialiserar snapshot</text>

  <rect x="120" y="860" width="430" height="84" rx="14" class="g"/>
  <text x="335" y="893" text-anchor="middle" class="t l">Live workspace per chat</text>
  <text x="335" y="919" text-anchor="middle" class="t sm">Next dev → stabil preview-URL /{chatId}</text>

  <rect x="730" y="860" width="430" height="84" rx="14" class="w"/>
  <text x="945" y="893" text-anchor="middle" class="t l">Isolerad verify-workspace</text>
  <text x="945" y="919" text-anchor="middle" class="t sm">RenderGate / ReleaseGate på bunden revision</text>

  <path d="M640 182 L640 220" class="a"/><path d="M640 302 L640 342" class="a"/>
  <path d="M640 424 L640 464" class="a"/><path d="M640 550 L640 596" class="a"/>
  <path d="M640 688 L640 734" class="a"/>
  <path d="M640 804 L640 830 L335 830 L335 860" class="a"/>
  <path d="M640 804 L640 830 L945 830 L945 860" class="a"/>
</svg>
