name: merge-ready-freshness

# Restlista R9 — ta bort `merge:ready` när head byts eller en bot postar
# review/inline/kommentar-fynd efter författarens sign-off.
#
# Separat från review-window.yml (read-only väntan). Ingen ny required check
# och ingen verdict-triage — bara mekanisk label-invalidation.

on:
  pull_request:
    types: [synchronize]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  # Codex-sammanfattningar, GitGuardian och bugbot-summeringar landar som
  # vanliga PR-kommentarer, inte som reviews. Utan den här triggern överlever
  # labeln precis de fynden (granskning 2026-07-29).
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read

jobs:
  invalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `vercel[bot]` är avsiktligt tillåten på review-vägarna: Vercel Agent
    # Review postar riktiga logikfynd som review-kommentarer (bevisat på #642
    # och #643). Dess deploy-brus är däremot *issue*-kommentarer, så det är
    # bara där den filtreras bort.
    if: >
      github.event_name == 'pull_request' ||
      (
        github.event.sender.type == 'Bot' &&
        github.event.sender.login != 'dependabot[bot]' &&
        github.event.sender.login != 'github-actions[bot]' &&
        (
          github.event_name != 'issue_comment' ||
          (
            github.event.issue.pull_request != null &&
            github.event.sender.login != 'vercel[bot]'
          )
        )
      )

    steps:
      # Beslutslogiken ligger i `scripts/ci/merge-ready-freshness.mjs` så den
      # kan enhetstestas — bash inuti YAML kan den inte (Codex P1 på #652).
      #
      # Utan `ref:`, med flit: checkouten följer då samma ref som workflowen
      # själv kördes från. På `pull_request` är det PR:ens merge-commit, på
      # review-/kommentarvägarna default-branchen. Att pinna till
      # default-branchen såg säkrare ut men bröt `pull_request`-vägen för den
      # PR som inför skriptet — workflowen kom från PR:en, skriptet fanns bara
      # där, och node föll på ENOENT. Något skydd gav det inte heller: en
      # `pull_request`-körning använder redan PR:ens egen workflow-fil.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Remove stale merge:ready
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          SENDER: ${{ github.event.sender.login }}
          REVIEW_AT: ${{ github.event.review.submitted_at }}
          COMMENT_AT: ${{ github.event.comment.created_at }}
          PR_FROM_PULL: ${{ github.event.pull_request.number }}
          PR_FROM_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            PR_NUMBER="${PR_FROM_ISSUE}"
          else
            PR_NUMBER="${PR_FROM_PULL}"
          fi

          case "$EVENT_NAME" in
            pull_request_review) EVENT_AT="${REVIEW_AT:-}" ;;
            pull_request_review_comment|issue_comment) EVENT_AT="${COMMENT_AT:-}" ;;
            *) EVENT_AT="" ;;
          esac

          # `issue_comment` bär ingen head-sha i payloaden, så alla event-vägar
          # läser PR:en från API:t i stället.
          pr_json=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          HEAD_SHA=$(printf '%s' "$pr_json" | jq -r '.head.sha')

          # `created_at` per kommentar följer med: sign-offens tidpunkt tas från
          # GitHub, inte från det författarstyrda `at:`-fältet.
          comments_json=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | {body: (.body // ""), createdAt: .created_at}' 2>/dev/null | jq -s '.' || echo '[]')

          payload=$(jq -n \
            --arg eventName "$EVENT_NAME" \
            --arg headSha "$HEAD_SHA" \
            --arg eventAt "${EVENT_AT:-}" \
            --argjson pr "$pr_json" \
            --argjson comments "$comments_json" \
            '{
              eventName: $eventName,
              headSha: $headSha,
              eventAt: $eventAt,
              labels: [$pr.labels[].name],
              prBody: ($pr.body // ""),
              comments: $comments
            }')

          decision=$(printf '%s' "$payload" | node scripts/ci/merge-ready-freshness.mjs)
          ACTION=$(printf '%s' "$decision" | cut -f1)
          REASON=$(printf '%s' "$decision" | cut -f2-)

          if [ "$ACTION" != "remove" ]; then
            echo "Behåller merge:ready — ${REASON}"
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "merge:ready"
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "♻️ \`merge:ready\` borttagen automatiskt: ${REASON}."
          echo "Removed merge:ready on PR #${PR_NUMBER}: ${REASON}"
