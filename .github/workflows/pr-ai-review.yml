name: PR AI review

# Privileged event by design: the workflow and every executable file come from
# trusted `master`. PR content is fetched through GitHub's API as data only and
# is never checked out, installed, imported, or executed.
on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, converted_to_draft, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

# Different PRs run in parallel. Every delivery for one PR queues and executes
# serially so two events cannot create duplicate exhaustive reviews or race the
# persistent state comment.
concurrency:
  group: pr-ai-review-${{ github.event.pull_request.number }}
  queue: max

jobs:
  review:
    # GitHub treats Dependabot pull_request_target runs as fork-like and withholds
    # normal Actions secrets. Skip before checkout instead of producing a false
    # provider failure. Ordinary forks remain supported safely as diff-only data.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout trusted reviewer from master
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install trusted dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Review pull request
        id: review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PR_REVIEW_RESULT_PATH: ${{ runner.temp }}/pr-review-result.json
        run: node scripts/pr-review/run.mjs

      # pull_request_target-jobbets vanliga check ligger på default-branchens
      # SHA, inte PR-headen. Den betrodda publiceraren läser review-resultatet
      # och hämtar PR:ens live-head igen. Endast en full review av exakt den
      # headen, eller verifierad återhämtning av samma publicerade review-ID,
      # får success; vanlig skip/follow-up/stale blir action_required.
      - name: Publish trusted review receipt on current PR head
        if: steps.review.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_REVIEW_RESULT_PATH: ${{ runner.temp }}/pr-review-result.json
        run: node scripts/pr-review/receipt.mjs
