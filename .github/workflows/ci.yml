name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    # Efemär Postgres för de DB-backade kontraktstesterna (t.ex.
    # `scripts/db/files-revision-contract.postgres.test.ts`). Föds och dör med
    # jobbet, så inget delat tillstånd och ingen secret behövs.
    #
    # Varför INTE dev-Supabase här: varje PR skulle skriva rader i en delad
    # databas, två samtidiga PR:er kan kollidera, och testet blir beroende av
    # att en extern tjänst är uppe. Testet självt vägrar dessutom allt utom en
    # dev-target — se `check-db-env-target.mjs` — och en lokal Postgres räknas
    # som dev.
    # `trust` i stället för ett lösenord: containern är efemär och nås bara över
    # localhost inuti jobbet, så det finns inget att skydda — och ett inbäddat
    # lösenord i en committad fil är ett hardcoded-credential-mönster som
    # GitGuardian (korrekt) flaggade på första försöket. Utan lösenord finns
    # ingen hemlighet i filen alls, vilket är en riktig lösning i stället för
    # ett undantag i skannern.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: sajtmaskin_test
        ports:
          - 5432:5432
        # Default `pg_isready` runs as container user `root`, which is not a
        # Postgres role. Docker keeps probing every --health-interval, so
        # `FATAL: role "root" does not exist` repeats for the whole job.
        # `-U postgres` matches POSTGRES_USER.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # quality är required: jobbet måste alltid starta. Bara det tunga
      # baseline-deps:tree-steget kortsluts (se steget nedan).
      - name: Detect baseline-tree relevant changes
        id: baseline_tree
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tree:
              - 'src/lib/gen/export/project-scaffold.ts'
              - 'scripts/deps/validate-baseline-npm-tree.ts'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ESLint anropas med --cache --cache-location .eslintcache, men cachen
      # överlevde tidigare inte mellan körningar. .eslintcache är gitignorerad.
      # Repot hade ingen actions/cache sedan tidigare; v4 är den etablerade
      # majoren (v5/v6 kräver nyare runner-runtime).
      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      # Auto-sync embedding JSON from public Blob manifest before any step
      # that may read scaffold/variant embeddings (tests, validate, build).
      - name: Ensure embeddings (sync + verify)
        run: npm run embeddings:ensure

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # `POSTGRES_URL` sätts medvetet BARA på de två DB-stegen nedan, aldrig på
      # jobbnivå: standard-sviten körs utan databas, och flera tester verifierar
      # att appen degraderar snyggt när den saknas. En jobbnivå-variabel hade
      # ändrat förutsättningen för dem tyst.
      - name: Test
        run: npm run test:ci

      # Applicerar schema + alla migrationer i MIGRATION_ORDER, inklusive
      # add-files-revision.sql, mot den efemära databasen.
      - name: Initiera testdatabasen
        if: ${{ !cancelled() }}
        env:
          # `sslmode=disable` = ingen TLS mot service-containern (resolveSslConfig
          # i scripts/db/db-ssl.mjs äger den tolkningen).
          POSTGRES_URL: postgresql://postgres@localhost:5432/sajtmaskin_test?sslmode=disable
        run: npm run db:init

      # DB-backade kontraktstester (files_revision m.fl.). Egen lane, så de kan
      # inte påverka `test:ci` och vice versa.
      #
      # `REQUIRE_POSTGRES_TESTS=1` gör att ett HOPP räknas som fel här. Utan den
      # skulle en försvunnen databas ge "skipped" → exit 0 → grön grind som inte
      # bevisat något, alltså precis den false-green testet finns för att stänga.
      - name: DB-backade kontraktstester
        if: ${{ !cancelled() }}
        env:
          POSTGRES_URL: postgresql://postgres@localhost:5432/sajtmaskin_test?sslmode=disable
          REQUIRE_POSTGRES_TESTS: "1"
        run: npm run test:postgres

      # Grandmaster 5-7: the follow-up CONTRACT invariants (5-3/5-3b scaffold+route
      # freeze/clamp, 5-5 capability floor) are deterministic hard contracts — promote
      # them from the warn-only stability lane to a BLOCKING step so a regression reddens
      # CI instead of only warning. They still also run in the warn-only `stability` job
      # below (full set); this step hard-gates only the follow-up contract subset.
      - name: Follow-up contract invariants (blocking, grandmaster 5-7)
        # B14 (mirrors the C2 step below): run even if an earlier step (test:ci)
        # failed, so a follow-up-contract regression is never masked/skipped by a
        # red test:ci. Step gating defaults to success(); !cancelled() overrides.
        if: ${{ !cancelled() }}
        run: npm run test:followup-contract

      - name: Verify baseline dependency versions
        run: npm run baseline-deps:verify

      # Skyddsobjekt verifierat: validate-baseline-npm-tree.ts läser BARA
      # PACKAGE_JSON ur project-scaffold.ts (plus sig själv). Inget annat
      # jobb needs: detta steg — quality slutar grönt även när det hoppas över.
      # workflow_dispatch kör alltid (ingen PR-diff att filtrera på).
      - name: Verify baseline dependency tree
        if: ${{ github.event_name == 'workflow_dispatch' || steps.baseline_tree.outputs.tree == 'true' }}
        run: npm run baseline-deps:tree

      - name: Validate scaffold manifests
        run: npm run scaffolds:validate

      - name: Validate dossier manifests
        run: npm run dossiers:validate-all

      # Dossier-projektionen (data/dossiers/_index/capability-map.json) är
      # GENERERAD och läses aldrig i runtime — registryt går direkt på
      # data/dossiers/{hard,soft}/. Drift-checken togs bort 2026 som ren
      # underhållsskatt, men är tillbaka som blockerande steg eftersom
      # backoffice Systemkarta nu LÄSER filen: en stale projektion visar fel
      # F2-/build-status för operatören, alltså har staleness en verklig
      # konsument. Checken skriver inget, hashar bara `sourceFiles` och namnger
      # vilken vy som drivit isär. Fixa rött med
      # `npm run dossiers:capability-map:write` (eller backoffice "Bygg om").
      - name: Dossier-projektionen är färsk (blocking)
        run: npm run dossiers:capability-map:check

      - name: Validate control-plane registries
        run: npm run control-plane:check

      - name: Verify generated contract docs
        run: npm run docs:check

      - name: Verify active documentation links
        run: npm run docs:links

      - name: Verify historical plan statuses
        run: npm run plans:history:check

      - name: Verify terminology ownership
        run: npm run check:terms:contract

      - name: Verify removed v0 chat boundary
        run: npm run compat:v0-chat-boundary:check

      # Plan B #9: route `maxDuration` literals are generated from
      # config/ai_models/manifest.json routeTimeouts (canonical owner:
      # scripts/ai-models/sync-route-timeouts.mjs). Blocking gate so a drifted
      # literal reddens CI instead of shipping a stale per-route stream ceiling.
      - name: Verify route maxDuration ↔ manifest sync
        run: npm run route-timeouts:check

      # CI/Vercel-paritet (2026-07-03): Vercels prebuild kör `preflight:common`
      # — men detta jobb gjorde det inte, så en commit kunde bli CI-grön och
      # ändå fälla prod-deployen (hänt: #368). Kör samma sanity-checks här så
      # draft-PR:er fångar det före merge.
      # route-timeouts:check dubblas medvetet (billig, redan grön ovan).
      - name: Preflight parity with Vercel prebuild (blocking)
        if: ${{ !cancelled() }}
        run: npm run preflight:common

      # Bug-backloggens formatkontroll låg tidigare INUTI `preflight:common`, dvs
      # även i Vercels prebuild — en avbockad [x]-rad kvar i Aktiv kö kunde alltså
      # fälla PROD-BYGGET (hänt: #368). Bokföring i en markdown-fil ska inte kunna
      # stoppa en deploy, så checken är flyttad hit: fortfarande blockerande på PR
      # (samma enforcement, snabbare feedback) men utanför build-kedjan.
      - name: Bug-backlog sanity (blocking)
        if: ${{ !cancelled() }}
        run: npm run check:bug-backlog

  # Produktionsbygge (2026-07-29). `next build` kördes INGENSTANS före merge:
  # preview-deployer är avstängda i `vercel.json` (`deploymentEnabled` bara för
  # `master`), så första riktiga bygget av en ändring var prod-deployen EFTER
  # merge. typecheck + lint fångar det mesta men inte build-tidsfel (route-
  # config, RSC-gränser, prerender/`generateStaticParams`, felaktig
  # `vercel.json`-funktionsmatchning).
  #
  # Verifierat att bygget går igenom helt utan secrets, så jobbet får medvetet
  # INGA credentials — samma nyckelfria princip som schema-drift. `npm run build`
  # kör `prebuild` (preflight + embeddings:ensure) och sedan Turbopack-bygget,
  # vilket också gör detta till den enda platsen där hela prebuild-kedjan körs
  # exakt som Vercel kör den.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build (blocking, no secrets)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Backoffice Python tests: control-plane/domain-map parity, matching-config
  # strict-schema validate-on-save, manifest parity and page-import smoke.
  # Deterministic + keyless (no DB creds, no HTTP — all tests run offline).
  # Some tests invoke local `git` (baseline reset, building-blocks nav).
  # Blocking by design: domain-rules, prompt-heuristic-tokens and the scaffold-
  # variant schema declare `backoffice:test` as their control-plane validator,
  # so this job IS their structural guarantee. Mirrors the Python setup in
  # db-blob-sync-check.yml.
  backoffice-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Required check: jobbet MÅSTE alltid starta och sluta grönt. Ett
      # trigger-nivå-paths-filter skulle lämna checken pending och blockera
      # merge. Filtrera därför här och kortslut de tunga stegen.
      # Listan är verifierad mot backoffice/test_*.py: backoffice-kod,
      # observability, requirements, config-/schema-ytor testerna läser,
      # plus de enstaka TS/docs/Python-filer som är unika skyddsobjekt
      # (catalog-paritet, curator, capability-map, hub-docs, run-python).
      # package.json MÅSTE ingå: test_pipeline_health_script_parity.py och
      # test_database_health_smoke.py läser repots faktiska package.json och
      # asserterar att npm-scripten bakom Backoffice-knapparna finns. Utan den
      # raden kan ett script döpas om eller tas bort utan att paritetstestet
      # körs — exakt den döda knappen testet skrevs för att fånga (commit
      # 9adb3c4). Kostnaden är att jobbet körs på dependabot-PR:er, vilket inte
      # ligger på kritisk linje så länge quality tar ~9 min.
      # src/lib/db|auth|tenant ingår inte.
      - name: Detect backoffice-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backoffice:
              - 'backoffice/**'
              - 'sajtmaskin_backoffice.py'
              - 'scripts/observability/**'
              - 'requirements.backoffice*.txt'
              - 'package.json'
              - 'config/backoffice/**'
              - 'config/domain-rules.json'
              - 'config/prompt-heuristic-tokens.json'
              - 'config/scaffold-variants/**'
              - 'config/env-policy.json'
              - 'config/variant-template-addenda.json'
              - 'config/ai_models/**'
              - 'config/embeddings-blob-manifest.json'
              - 'docs/schemas/strict/**'
              - 'src/lib/models/catalog.ts'
              - 'src/lib/gen/scaffold-variants/extractor-fingerprint.ts'
              - 'src/lib/gen/scaffold-variants/template-inspiration.ts'
              - 'src/lib/templates/local-v0-template-source.ts'
              - 'scripts/v0-templates/audit-template-repos.mjs'
              - 'scripts/dossiers/curate-from-reference.ts'
              - 'scripts/dossiers/transaction_adapter.py'
              - 'scripts/scaffolds/auto-curate-variant-patterns.ts'
              - 'scripts/scaffolds/generate-variant-embeddings.ts'
              - 'scripts/template_curator/**'
              - 'scripts/dev/run-python.mjs'
              - 'data/dossiers/_index/capability-map.json'
              - 'docs/architecture/glossary.md'
              - 'docs/contracts/dossier-system.md'
              - 'docs/contracts/scaffold-system.md'
              - 'scripts/db/db-health-check.mjs'
              - 'scripts/db/add-performance-indexes.mjs'
              - 'scripts/db/redis-health-check.mjs'

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backoffice == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup Python
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backoffice == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install backoffice dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backoffice == 'true' }}
        run: python -m pip install --disable-pip-version-check -r requirements.backoffice.txt

      # Curator-testerna kör den statiska Node-auditorn mot lokala ZIP-fixtures.
      # Installera exakt lockfilens beroenden; inga package scripts behövs här.
      - name: Install template auditor dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backoffice == 'true' }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Backoffice tests (blocking)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backoffice == 'true' }}
        run: npm run backoffice:test

      # Genlogg-insamlingen (scripts/observability/last-generated-usersite.py).
      # Också nyckelfri och offline: env-parsning, secret-maskering,
      # mapprotation, prissättning, bedömning och rapportrendering.
      - name: Observability script tests (blocking)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backoffice == 'true' }}
        run: npm run observability:test

      - name: Skip backoffice tests (no relevant changes)
        if: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.backoffice != 'true' }}
        run: echo "No backoffice-related files changed; skipping install and tests."

  # Blockerande schema-drift-gate (grandmaster S4). Deterministisk, nyckelfri och billig:
  # låser att avsett schema (src/lib/db/schema.ts) == applicerat (db-init.mjs /
  # add-performance-indexes.mjs / migrations/*.sql). Kräver inga DB-creds. Medvetet UTAN
  # continue-on-error → ett rött resultat blockerar push/PR/merge. Den bredare vitest-
  # stabilitets-lanen nedan förblir warn-only (kan vara flaky).
  schema-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Schema-drift gate (blocking)
        run: npm run db:schema-drift

  # Warn-only stabilitets-lane (grandmaster S1). Avsiktligt icke-blockerande:
  # continue-on-error gör att ett rött stabilitets-resultat aldrig blockerar
  # merge medan lanen stabiliseras. S4:s db:schema-drift-gate körs blockerande i det
  # separata schema-drift-jobbet ovan; här ligger den bredare (flaky) vitest-lanen
  # warn-only. Detta är platsen där C2 (ordlista-check) lägger sitt CI-steg.
  # Icke-required: trigger-nivå-paths skulle skippa hela jobbet (OK här).
  # Jobben delar dock `on:` med required quality/build/schema-drift, så ett
  # workflow-nivå-paths skulle tysta även dem. Samma in-job-filter som
  # backoffice-tests, men skip här är bara tidsvinst — inte en grind.
  stability:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect stability-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            stability:
              - '**/*.stability.test.ts'
              - '**/*.stability.test.tsx'
              - 'vitest.stability.config.ts'
              - 'vitest.config.ts'
              - 'src/lib/logging/**'
              - 'src/lib/gen/**'
              - 'src/lib/builder/**'
              - 'src/lib/db/**'
              - 'scripts/db/**'
              - 'scripts/dev/check-term-coverage.mjs'
              - 'scripts/docs/**'
              - 'docs/architecture/glossary.md'
              - 'config/naming-dictionary.json'
              - 'docs/**/*.md'
              - 'docs/**/*.mdx'

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.stability == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.stability == 'true' }}
        run: npm ci

      - name: Stability lane (warn-only)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.stability == 'true' }}
        run: npm run test:stability

      # Grandmaster C2: light ordlista-check. Warn-first by design - the script always
      # exits 0 and this whole job is continue-on-error, so it never blocks push/PR/merge.
      # if: !cancelled() so it still runs even if an earlier step (the flaky stability
      # lane) failed - step-level gating defaults to success(), which job-level
      # continue-on-error does NOT override. Skips only on an actual run cancellation.
      - name: Ordlista-check (warn-only, grandmaster C2)
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.stability == 'true') }}
        run: npm run check:terms

      - name: Skip stability (no relevant changes)
        if: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.stability != 'true' }}
        run: echo "No stability-related files changed; skipping install and tests."

  # Preview-host runtime-guards (A#13/A#28). `preview-host/` är ett fristående
  # Node-paket (egen `package.json`, ingen lockfile → `npm install`, inte
  # `npm ci`). Guard-testerna är deterministiska, nyckelfria och plattforms-
  # oberoende (kör mot tmpdir, ingen Fly/nät): `check` (syntax), `test:guards`
  # (timeout-settle, idle-sweep, boot-serialisering) och `test:patch`. Kördes
  # tidigare bara lokalt, så en regression i preview-host-runtimen syntes först
  # på Fly. Blockerande gate (att göra checken required på master-rulesetet är
  # ett separat repo-inställningsval).
  preview-host-guards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect preview-host-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            preview_host:
              - 'preview-host/**'

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.preview_host == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install preview-host dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.preview_host == 'true' }}
        working-directory: preview-host
        run: npm install --no-audit --no-fund

      - name: Preview-host runtime guards (blocking)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.preview_host == 'true' }}
        working-directory: preview-host
        run: npm run check && npm run test:guards && npm run test:patch

      - name: Skip preview-host guards (no relevant changes)
        if: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.preview_host != 'true' }}
        run: echo "No preview-host files changed; skipping install and tests."

  # Dead-code / orphan-file-hygien (självgående städ-enforcement). knip är tunat i
  # knip.json så FILES-kategorin har noll falska positiver: dynamiskt körda kataloger
  # (shadcn `src/components/ui/`, `scripts/`, mcp/cli-entries, scaffold-scoring-spegeln)
  # är deklarerade som knip `entry` → deras importer räknas och deras exporter flaggas
  # inte. Två lanes:
  #   1. Full rådgivande rapport (`|| true`, faller ALDRIG) så deps/exports-svansen syns
  #      på varje PR utan att blockera. OBS: "unused dependencies" är till stor del FALSKA
  #      positiver här — generatorn lagrar paket-NAMN som data (dep-completer /
  #      import-validator) och shadcn importerar meta-paketet `radix-ui`, så individuella
  #      @radix-ui/* ser oanvända ut. Verifiera innan något tas bort.
  #   2. Orphan-FIL-grind (blockerande): en genuint oimporterad källfil rödar CI. Fixa
  #      genom att radera den — eller, om den är runtime-/tooling-laddad, lägg till den i
  #      knip.json `entry`. Runbook: docs/runbooks/hygiene.md.
  # Som `preview-host-guards`: jobbet failar hårt, men det är ännu INTE en required
  # check på master-rulesetet, så ett rött resultat blockerar inte merge av sig självt.
  dead-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect dead-code-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dead_code:
              - 'knip.json'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'tsconfig*.json'
              - 'src/**'
              - 'scripts/**'

      - name: Setup Node.js
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.dead_code == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.dead_code == 'true' }}
        run: npm ci

      - name: Dead-code report (full, advisory — never blocks)
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || steps.filter.outputs.dead_code == 'true') }}
        run: npm run knip || true

      - name: Orphan-file gate (blocking)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.dead_code == 'true' }}
        run: npm run knip:files

      - name: Skip dead-code (no relevant changes)
        if: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.dead_code != 'true' }}
        run: echo "No knip-related files changed; skipping install and knip."

  # Auto-applicerar migrationer mot PRODUKTIONS-databasen vid merge till master —
  # så en migration ALDRIG kan bli deployad utan att köras (grundorsaken till att
  # add-branded-site-domains.sql saknades i prod: migrationer körs INTE automatiskt
  # vid Vercel-deploy). Idempotent (`IF NOT EXISTS`) + bokför schema_migrations-
  # ledgern, så varje re-run är en no-op.
  #
  # SÄKERHET: prod-secret injiceras ALDRIG på pull_request (samma mönster som
  # prod-migrations-applied / db-blob-sync-check) — bara trusted events (push
  # master / manuell dispatch), så PR-kontrollerad kod aldrig ser prod-creds.
  # Guard-steget SKIP:ar apply tyst om secret:en saknas (fork utan creds) så
  # jobbet inte blir falskt rött där.
  #
  # Gate:as bakom quality + schema-drift så prod-schemat ALDRIG muteras för en
  # trasig merge. Additiv migration parallellt med Vercels deploy är ofarligt;
  # vill man ha helt race-fritt gate:ar man deployen bakom detta jobb separat.
  prod-migrations-apply:
    if: github.event_name != 'pull_request'
    needs: [quality, schema-drift]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fork-/no-secret-säkerhet: en fork (annat repo) saknar secret:en och SKIP:ar
      # apply i stället för att falla rött. MEN på HUVUDREPOT ska en saknad secret
      # falla HÅRT RÖTT — annars återuppstår exakt den false-green som orsakade den
      # ursprungliga saknade migrationen (apply skippas tyst + check exit 0 = grönt
      # utan att prod migrerats). Buggsvärm 2026-07-11: 3 oberoende träffar.
      - name: Detect prod credentials
        id: creds
        env:
          POSTGRES_URL_PROD: ${{ secrets.POSTGRES_URL_PROD }}
        run: |
          if [ -n "$POSTGRES_URL_PROD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.repository }}" = "Jakeminator123/sajtmaskin" ]; then
            echo "::error::POSTGRES_URL_PROD saknas på huvudrepot — prod-migrationer kan inte auto-appliceras (false-green-risk). Sätt den: gh secret set POSTGRES_URL_PROD"
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::POSTGRES_URL_PROD saknas — hoppar över auto-apply (fork/no-secret)."
          fi

      # Dev/prod-identitetsguard: POSTGRES_URL_PROD MÅSTE peka på prod-Supabase
      # (config/db-targets.json). Stoppar att prod-migrationer någonsin körs
      # mot dev-databasen (eller ett okänt projekt) p.g.a. felkonfigurerad
      # secret. Sanitiserad utskrift — aldrig credentials.
      - name: Verify prod DB identity (db-targets guard)
        if: steps.creds.outputs.present == 'true'
        run: node scripts/db/check-db-env-target.mjs --expect=prod
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL_PROD }}

      - name: Apply pending migrations to production (idempotent)
        if: steps.creds.outputs.present == 'true'
        run: npx tsx scripts/db/run-migrations.ts
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL_PROD }}
          DB_ALLOW_PROD_LIKE_WRITE: "1"
          DB_SSL_REJECT_UNAUTHORIZED: "false"

      # Performance indexes are declared in add-performance-indexes.mjs (not in
      # the SQL-migration ledger), so before this they only reached prod via the
      # backoffice "Databashälsa"-button — a new hot-path index could silently
      # never land in prod. Apply them here too: the script is idempotent
      # (CREATE INDEX IF NOT EXISTS + dedupe-aware), so every run is a no-op once
      # the indexes exist. Same prod-write guard (DB_ALLOW_PROD_LIKE_WRITE) as the
      # migration step above.
      - name: Apply performance indexes to production (idempotent)
        if: steps.creds.outputs.present == 'true'
        run: npm run db:perf-indexes -- --reason "auto:ci-master-push"
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL_PROD }}
          DB_ALLOW_PROD_LIKE_WRITE: "1"
          DB_SSL_REJECT_UNAUTHORIZED: "false"

  # Verifierar EFTER auto-apply att PRODUKTIONS-databasen har ALLA migrations
  # applicerade (schema_migrations-ledgern == MIGRATION_ORDER). Read-only mot prod
  # (bara SELECT). `needs: prod-migrations-apply` gör detta till en post-condition
  # på apply-jobbet: rött = apply lyckades inte få prod i synk (ska aldrig hända
  # när apply gått grönt) → kör `npm run db:migrate:prod` manuellt.
  #
  # SÄKERHET: prod-secret injiceras ALDRIG på pull_request (samma mönster som
  # db-blob-sync-check) — jobbet körs bara på trusted events (push master /
  # manuell dispatch), så PR-kontrollerad kod aldrig ser prod-creds. Saknas
  # secret (fork) SKIP:ar checken med exit 0.
  prod-migrations-applied:
    if: github.event_name != 'pull_request'
    needs: prod-migrations-apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prod migration-ledger gate (blocking)
        run: node scripts/db/check-migrations-applied.mjs
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL_PROD }}
          DB_SSL_REJECT_UNAUTHORIZED: "false"

  # Live dev↔prod-synk i två steg (samma trusted-event-modell som apply-jobben
  # ovan — prod-/dev-secrets injiceras ALDRIG på pull_request):
  #
  #   1. Auto-applicera migrationer + perf-index mot DEV-databasen. Prod får
  #      sina via prod-migrations-apply; utan detta steg fick dev dem först
  #      när någon råkade köra `npm run dev` lokalt, och databaserna gled
  #      isär mellan varven.
  #   2. `db:schema-parity` — jämför de två LEVANDE databaserna objekt för
  #      objekt (tabeller, kolumner, index, constraints). Rött = verklig
  #      drift som varken den statiska schema-drift-gaten eller ledger-
  #      checkarna kan se (t.ex. en kolumn skapad direkt i Supabase-
  #      dashboarden, eller en apply som bara halvlyckades).
  #
  # `needs: prod-migrations-apply` så pariteten alltid mäts EFTER att prod
  # fått sina migrationer — annars vore varje merge med migration falskt röd.
  # Den schemalagda systern (db-schema-parity.yml) fångar drift mellan pushar.
  db-schema-parity:
    if: github.event_name != 'pull_request'
    needs: prod-migrations-apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Samma false-green-skydd som prod-migrations-apply: på huvudrepot är
      # saknade secrets ett HÅRT fel; forkar utan secrets SKIP:ar i stället.
      - name: Detect dev + prod credentials
        id: creds
        env:
          POSTGRES_URL_DEV: ${{ secrets.POSTGRES_URL_DEV }}
          POSTGRES_URL_PROD: ${{ secrets.POSTGRES_URL_PROD }}
        run: |
          if [ -n "$POSTGRES_URL_DEV" ] && [ -n "$POSTGRES_URL_PROD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.repository }}" = "Jakeminator123/sajtmaskin" ]; then
            echo "::error::POSTGRES_URL_DEV och/eller POSTGRES_URL_PROD saknas på huvudrepot — dev-synk + schema-paritet kan inte verifieras (false-green-risk). Sätt dem: gh secret set POSTGRES_URL_DEV / POSTGRES_URL_PROD"
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DB-secrets saknas — hoppar över dev-synk + schema-paritet (fork/no-secret)."
          fi

      # Identitetsguard: POSTGRES_URL_DEV MÅSTE peka på dev-Supabase enligt
      # config/db-targets.json — migrationssteget nedan skriver dit.
      - name: Verify dev DB identity (db-targets guard)
        if: steps.creds.outputs.present == 'true'
        run: node scripts/db/check-db-env-target.mjs --expect=dev
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL_DEV }}

      - name: Apply pending migrations to dev (idempotent)
        if: steps.creds.outputs.present == 'true'
        run: npx tsx scripts/db/run-migrations.ts
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL_DEV }}
          DB_SSL_REJECT_UNAUTHORIZED: "false"

      - name: Apply performance indexes to dev (idempotent)
        if: steps.creds.outputs.present == 'true'
        run: npm run db:perf-indexes -- --reason "auto:ci-master-push-dev"
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL_DEV }}
          DB_SSL_REJECT_UNAUTHORIZED: "false"

      # Själva paritetsgaten. --require: nu MÅSTE båda sidor gå att nå —
      # en tyst skip här vore exakt den false-green gaten finns för att stänga.
      # Skriptet identitetscheckar båda URL:erna mot config/db-targets.json
      # innan någon query körs.
      - name: Live schema-parity gate dev↔prod (blocking)
        if: steps.creds.outputs.present == 'true'
        run: npm run db:schema-parity -- --require
        env:
          POSTGRES_URL_DEV: ${{ secrets.POSTGRES_URL_DEV }}
          POSTGRES_URL_PROD: ${{ secrets.POSTGRES_URL_PROD }}
