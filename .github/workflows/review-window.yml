name: review-window

# FAS 1 / BOOTSTRAP: den här pull_request-grinden bevarar det redan required
# checknamnet medan den betrodda default-branch-controllern landar. Den gör
# enbart 7-minutersfönstret och reviewkvittona och checkar inte ut/kör något
# repo-script. Själva pull_request-workflowen är ändå head-kontrollerad och ska
# därför tas bort i rolloutens fas 2 när controllern i
# merge-ready-freshness.yml finns på master. Jobbet får bara heta den required
# checken på den enda fas-1-grenen. På alla andra grenar får ett event bara
# skapa ett avsiktligt annat, skippat jobbnamn så att bootstrap och trusted
# controller aldrig kan kollidera i GitHubs check-aggregering.

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-window-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  review-window:
    name: ${{ github.event.pull_request.draft == false && github.event.pull_request.number == 1146 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chore/agent-workflow-v2' && 'review-window' || 'review-window-bootstrap-retired' }}
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.number == 1146 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/agent-workflow-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Wait for minimum review window + external bots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail

          MIN_HEAD_AGE=420
          MIN_BOT_SETTLE=180
          MAX_BOT_WAIT=600
          QUALIFYING_PATTERNS='trusted-pr-ai-review|agent review|find critical bugs|bugbot|codex'
          SECURITY_VETO_PATTERNS='gitguardian'
          DEPLOYMENT_CHECK_NAMES='Vercel'

          start_epoch=$(date -u +%s)
          poll_ok="false"
          poll_status="inte-körd"
          completed_count=0
          failed_count=0
          pending=0
          security_failed=0
          security_pending=0
          deployment_failed=0
          deployment_pending=0

          fail_closed() {
            elapsed="$1"
            if [ "$poll_ok" != "true" ]; then
              failure="senaste check-run-pollen misslyckades (exit ${poll_status})"
            elif [ "${security_failed:-0}" -gt 0 ]; then
              failure="${security_failed} säkerhetsskannrar är röda"
            elif [ "${security_pending:-0}" -gt 0 ]; then
              failure="${security_pending} säkerhetsskannrar är fortfarande queued/in_progress"
            elif [ "${deployment_failed:-0}" -gt 0 ]; then
              failure="${deployment_failed} deployments är röda"
            elif [ "${deployment_pending:-0}" -gt 0 ]; then
              failure="${deployment_pending} deployments är fortfarande queued/in_progress"
            elif [ "${completed_count:-0}" -eq 0 ]; then
              failure="inga verifierade reviewkvitton blev completed med conclusion=success (misslyckade=${failed_count:-0})"
            elif [ "${pending:-0}" -gt 0 ]; then
              failure="${pending} matchade botkontroller är fortfarande queued/in_progress"
            else
              failure="botresultaten verifierades inte före tidsgränsen"
            fi
            echo "::error::review-window bootstrap fail-closed efter ${elapsed}s: ${failure}; merge blockeras för head ${SHA}."
            exit 1
          }

          while true; do
            now=$(date -u +%s)
            waited=$(( now - start_epoch ))
            if [ "$waited" -ge "$MAX_BOT_WAIT" ]; then fail_closed "$waited"; fi

            remaining=$(( MAX_BOT_WAIT - waited ))
            poll_timeout=60
            if [ "$remaining" -lt "$poll_timeout" ]; then poll_timeout="$remaining"; fi

            runs=$(timeout "$poll_timeout" gh api --method GET --paginate -F per_page=100 \
              "repos/${REPO}/commits/${SHA}/check-runs" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')
            poll_status=$?
            poll_ok="true"
            if [ "$poll_status" -ne 0 ]; then
              poll_ok="false"
              runs=""
              echo "::warning::Kunde inte läsa check-runs för ${SHA} (exit ${poll_status}); försöker igen."
            fi

            matched=$(printf '%s\n' "$runs" | grep -iE "$QUALIFYING_PATTERNS" || true)
            security=$(printf '%s\n' "$runs" | grep -iE "$SECURITY_VETO_PATTERNS" || true)
            deployment=$(printf '%s\n' "$runs" | awk -F'\t' -v names="$DEPLOYMENT_CHECK_NAMES" '
              BEGIN {
                count = split(names, values, "|")
                for (i = 1; i <= count; i++) wanted[values[i]] = 1
              }
              NF >= 1 && ($1 in wanted)
            ')
            matched_count=$(printf '%s' "$matched" | grep -c . || true)
            completed_count=$(printf '%s\n' "$matched" | awk -F'\t' 'NF>=3 && $2=="completed" && $3=="success"{c++} END{print c+0}')
            failed_count=$(printf '%s\n' "$matched" | awk -F'\t' 'NF>=2 && $2=="completed" && $3!="success"{c++} END{print c+0}')
            pending=$(printf '%s\n' "$matched" | awk -F'\t' 'NF>=2 && $2!="completed"{c++} END{print c+0}')
            security_failed=$(printf '%s\n' "$security" | awk -F'\t' 'NF>=2 && $2=="completed" && $3!="success"{c++} END{print c+0}')
            security_pending=$(printf '%s\n' "$security" | awk -F'\t' 'NF>=2 && $2!="completed"{c++} END{print c+0}')
            deployment_failed=$(printf '%s\n' "$deployment" | awk -F'\t' 'NF>=2 && $2=="completed" && $3!="success"{c++} END{print c+0}')
            deployment_pending=$(printf '%s\n' "$deployment" | awk -F'\t' 'NF>=2 && $2!="completed"{c++} END{print c+0}')

            now=$(date -u +%s)
            waited=$(( now - start_epoch ))
            bots_done="false"
            if [ "$poll_ok" = "true" ] && [ "$completed_count" -gt 0 ] && \
              [ "$pending" -eq 0 ] && [ "$security_failed" -eq 0 ] && \
              [ "$security_pending" -eq 0 ] && [ "$deployment_failed" -eq 0 ] && \
              [ "$deployment_pending" -eq 0 ] && [ "$waited" -ge "$MIN_BOT_SETTLE" ]; then
              bots_done="true"
            fi

            if [ "$waited" -ge "$MAX_BOT_WAIT" ]; then fail_closed "$waited"; fi
            if [ "$waited" -ge "$MIN_HEAD_AGE" ] && [ "$bots_done" = "true" ]; then
              echo "✓ bootstrap review-window uppfyllt för aktuell head (matchade=${matched_count}, lyckade=${completed_count}, misslyckade=${failed_count}, pending=${pending}, väntat=${waited}s)"
              exit 0
            fi

            echo "väntar… aktuell head=${waited}s, matchade=${matched_count}, lyckade=${completed_count}, pending=${pending}, security-failed=${security_failed}, security-pending=${security_pending}, deployment-failed=${deployment_failed}, deployment-pending=${deployment_pending}"
            remaining=$(( MAX_BOT_WAIT - waited ))
            sleep_for=20
            if [ "$remaining" -lt "$sleep_for" ]; then sleep_for="$remaining"; fi
            if [ "$sleep_for" -gt 0 ]; then sleep "$sleep_for"; fi
          done
