name: Dossier acceptance

on:
  push:
    branches: [preview]
  pull_request:
    # Retargeting is drafted by pr-base-guard; ready_for_review tests the new base.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Measure the full matrix with an empty npm cache (no shared caches deleted)
        type: boolean
        default: false

# Only new PR heads/readiness replace stale runs. Body/title edits must not create
# a newer skipped suite that hides the required receipt. Integration runs stay unique.
concurrency:
  group: dossier-acceptance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Always-on classifier. Preview PRs and pushes publish run_matrix=false
  # (deferred-to-promote, owner decision 2026-10-22) so the required aggregate
  # stays green; promote PRs, schedule and manual runs always get the full matrix.
  scope:
    runs-on: ubuntu-latest
    outputs:
      run_matrix: ${{ steps.classify.outputs.run_matrix }}
      reason: ${{ steps.classify.outputs.reason }}
      dossiers: ${{ steps.classify.outputs.dossiers }}
      matrix_mode: ${{ steps.classify.outputs.matrix_mode }}
    steps:
      - name: Checkout with PR history
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify dossier-acceptance scope
        id: classify
        env:
          SAJTMASKIN_PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SAJTMASKIN_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SAJTMASKIN_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SAJTMASKIN_PUSH_BASE_SHA: ${{ github.event.before }}
        run: node scripts/dossiers/acceptance-scope.mjs

  discover:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.run_matrix == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      dossiers: ${{ steps.matrix.outputs.dossiers }}
      artifact_id: ${{ steps.projects.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate selected dossiers with files (hard + soft)
        id: matrix
        env:
          ACCEPTANCE_DOSSIERS: ${{ needs.scope.outputs.dossiers }}
          ACCEPTANCE_REQUIRE_FULL: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref != 'preview' }}
        run: |
          dossiers=$(node scripts/dossiers/list-acceptance-matrix.mjs)
          echo "dossiers=$dossiers" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: ${{ !(github.event_name == 'workflow_dispatch' && inputs.cold_cache) && 'npm' || '' }}
          package-manager-cache: false

      - name: Use an empty npm cache for the manual cold measurement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cold_cache }}
        run: |
          cache="$RUNNER_TEMP/dossier-cold-npm"
          test ! -e "$cache" || { echo "::error::Cold cache directory already exists"; exit 1; }
          echo "NPM_CONFIG_CACHE=$cache" >> "$GITHUB_ENV"

      - name: Install repository dependencies once for materialization
        run: npm ci

      - name: Materialize selected keyless projects
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}/acceptance-projects
          ACCEPTANCE_DOSSIERS: ${{ steps.matrix.outputs.dossiers }}
        run: |
          node scripts/dossiers/materialize-acceptance-matrix.mjs
          tar -czf "$RUNNER_TEMP/acceptance-projects.tar.gz" -C "$ACCEPTANCE_ROOT" .

      # Same run/attempt only. Never consumed by privileged workflows. Packing
      # preserves generated dotfiles without uploading any repository env files.
      - name: Share prepared source projects within this run
        id: projects
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dossier-projects-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/acceptance-projects.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Catalog freshness is a scheduled/manual sentinel and may intentionally be
  # red for an explicit `unverified` dossier. It must not false-red an otherwise
  # valid PR whose acceptance projects all build.
  verification-evidence:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: ${{ !(github.event_name == 'workflow_dispatch' && inputs.cold_cache) && 'npm' || '' }}
          package-manager-cache: false

      - name: Use an empty npm cache for the manual cold measurement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cold_cache }}
        run: |
          cache="$RUNNER_TEMP/dossier-cold-npm"
          test ! -e "$cache" || { echo "::error::Cold cache directory already exists"; exit 1; }
          echo "NPM_CONFIG_CACHE=$cache" >> "$GITHUB_ENV"

      - name: Install repository dependencies
        run: npm ci

      # Intentionally red while any dossier is explicit `unverified`, stale,
      # future-dated or invalid. Never convert legacy import dates into green
      # acceptance evidence merely because the date is recent.
      - name: Require current dossier acceptance evidence
        run: npm run dossiers:check-freshness

  dependency-registry:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.run_matrix == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: ${{ !(github.event_name == 'workflow_dispatch' && inputs.cold_cache) && 'npm' || '' }}
          package-manager-cache: false

      - name: Use an empty npm cache for the manual cold measurement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cold_cache }}
        run: |
          cache="$RUNNER_TEMP/dossier-cold-npm"
          test ! -e "$cache" || { echo "::error::Cold cache directory already exists"; exit 1; }
          echo "NPM_CONFIG_CACHE=$cache" >> "$GITHUB_ENV"

      - name: Install repository dependencies
        run: npm ci

      - name: Resolve every dossier dependency range on npm
        run: npm run dossiers:check-dependencies:registry

  keyless-production-build:
    needs: [scope, discover]
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Keep every isolated build, but avoid seven serial batches for 21 dossiers.
      max-parallel: 6
      matrix:
        dossier: ${{ fromJSON(needs.discover.outputs.dossiers) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: ${{ !(github.event_name == 'workflow_dispatch' && inputs.cold_cache) && 'npm' || '' }}
          package-manager-cache: false

      - name: Use an empty npm cache for the manual cold measurement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.cold_cache }}
        run: |
          cache="$RUNNER_TEMP/dossier-cold-npm"
          test ! -e "$cache" || { echo "::error::Cold cache directory already exists"; exit 1; }
          echo "NPM_CONFIG_CACHE=$cache" >> "$GITHUB_ENV"

      - name: Require the prepared artifact receipt
        env:
          ARTIFACT_ID: ${{ needs.discover.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "::error::Missing prepared artifact receipt"; exit 1; }'

      - name: Download prepared source from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.discover.outputs.artifact_id }}
          path: ${{ runner.temp }}/acceptance-artifact

      - name: Unpack selected keyless project
        env:
          DOSSIER_ID: ${{ matrix.dossier }}
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance-projects"
          tar -xzf "$RUNNER_TEMP/acceptance-artifact/acceptance-projects.tar.gz" -C "$RUNNER_TEMP/acceptance-projects" "./$DOSSIER_ID"
          mv "$RUNNER_TEMP/acceptance-projects/$DOSSIER_ID" "$RUNNER_TEMP/dossier-$DOSSIER_ID"

      - name: Install generated-project dependencies
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}/dossier-${{ matrix.dossier }}
        run: npm --prefix "$ACCEPTANCE_ROOT" install --no-audit --no-fund

      - name: Typecheck generated project without provider secrets
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}/dossier-${{ matrix.dossier }}
        run: npm --prefix "$ACCEPTANCE_ROOT" run typecheck

      - name: Production-build generated project without provider secrets
        env:
          ACCEPTANCE_ROOT: ${{ runner.temp }}/dossier-${{ matrix.dossier }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm --prefix "$ACCEPTANCE_ROOT" run build

  # Required aggregate. Green when the matrix is green, or when a successful
  # scope decision legitimately skipped it. Red if scope failed, the matrix
  # failed, or a skip was not legitimate. Same pattern as CI `quality`.
  dossier-acceptance:
    name: dossier-acceptance
    needs:
      - scope
      - discover
      - verification-evidence
      - dependency-registry
      - keyless-production-build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required dossier-acceptance result
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MATRIX_MODE: ${{ needs.scope.outputs.matrix_mode }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_MATRIX: ${{ needs.scope.outputs.run_matrix }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          EVIDENCE_RESULT: ${{ needs.verification-evidence.result }}
          REGISTRY_RESULT: ${{ needs.dependency-registry.result }}
          BUILD_RESULT: ${{ needs.keyless-production-build.result }}
        run: |
          set -euo pipefail
          EXPECT_MATRIX=true
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" != "preview" ]; then
            if [ "$RUN_MATRIX" != "true" ] || [ "$MATRIX_MODE" != "full" ]; then
              echo "::error::non-preview PR requires the full dossier matrix"
              exit 1
            fi
          elif { [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; } && [ "$SCOPE_RESULT" = "success" ] && [ "$RUN_MATRIX" = "false" ]; then
            EXPECT_MATRIX=false
          fi
          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::scope=${SCOPE_RESULT} (run_matrix=${RUN_MATRIX})"
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "push" ]; then
            if [ "$EVIDENCE_RESULT" != "skipped" ]; then
              echo "::error::PR/push must skip freshness evidence, got ${EVIDENCE_RESULT}"
              exit 1
            fi
          elif [ "$EVIDENCE_RESULT" != "success" ]; then
            echo "::error::scheduled/manual freshness=${EVIDENCE_RESULT}"
            exit 1
          fi
          if [ "$EXPECT_MATRIX" = "true" ]; then
            if [ "$DISCOVER_RESULT" != "success" ] || [ "$REGISTRY_RESULT" != "success" ] || [ "$BUILD_RESULT" != "success" ]; then
              echo "::error::matrix required but discover=${DISCOVER_RESULT} registry=${REGISTRY_RESULT} build=${BUILD_RESULT}"
              exit 1
            fi
          elif [ "$DISCOVER_RESULT" != "skipped" ] || [ "$REGISTRY_RESULT" != "skipped" ] || [ "$BUILD_RESULT" != "skipped" ]; then
            echo "::error::irrelevant diff must skip matrix, got discover=${DISCOVER_RESULT} registry=${REGISTRY_RESULT} build=${BUILD_RESULT}"
            exit 1
          fi
          echo "✓ dossier-acceptance aggregate green (matrix=${EXPECT_MATRIX}, reason scope=${SCOPE_RESULT}/${RUN_MATRIX})"

  # A Preview receipt must never satisfy the separate master-only required check.
  # The tiny aggregate survives cancellation so skipped/cancelled work fails closed.
  dossier-acceptance-master:
    name: ${{ (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master') && 'dossier-acceptance-master' || 'dossier-master-not-applicable' }}
    if: ${{ always() && (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'master') }}
    needs: [scope, discover, dependency-registry, keyless-production-build, dossier-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require a complete successful master matrix
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MATRIX_MODE: ${{ needs.scope.outputs.matrix_mode }}
          RUN_MATRIX: ${{ needs.scope.outputs.run_matrix }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          REGISTRY_RESULT: ${{ needs.dependency-registry.result }}
          BUILD_RESULT: ${{ needs.keyless-production-build.result }}
          ACCEPTANCE_RESULT: ${{ needs.dossier-acceptance.result }}
        run: node scripts/dossiers/check-master-acceptance.mjs
