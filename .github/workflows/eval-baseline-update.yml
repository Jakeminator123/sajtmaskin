name: Eval Baseline Update

# Manual-only. The Monday 04:11 UTC schedule was removed 2026-08-17 after
# 20 consecutive red runs (most recently OpenAI `credit_balance_exhausted`).
# A scheduled paid job that nobody reads is pure cost.
#
# Trigger: workflow_dispatch. The operator picks dry-run vs. real save.
# Do not re-add `schedule:` without an explicit owner decision.
#
# Cost (observed, not a guess):
#   - 2026-07-31 full run: 13.90 USD
#   - Today's larger prompt context: estimated 19–24 USD
#   - A failed run can still cost ~8.50 USD in input tokens if the suite
#     keeps submitting after the account is already dead
#
# Required secrets:
#   - OPENAI_API_KEY    → consumed by the eval LLM calls.
#   - POSTGRES_URL_PROD → the eval's codegen path reads `generation_telemetry`
#     for scaffold scoring/retry, so `runEval` refuses to spend LLM tokens
#     without a database (`resolveEvalEnvironment`, runner.ts). Production is
#     the deliberate target: the eval is READ-ONLY (it persists no chat or
#     version, spends no credits and boots no preview VM — see
#     `src/lib/gen/eval/README.md`), and scaffold scoring is only meaningful
#     against real generation history, which dev does not have. The write
#     guard is left unset on purpose: no `DB_ALLOW_PROD_LIKE_WRITE` here, so
#     anything that ever tried to WRITE to prod from this job would fail
#     rather than silently mutate production.
#
# Behavior:
#   1. Run a SINGLE `cli.ts` invocation with `--gate` (and `--save-baseline`
#      unless dry_run is true). cli.ts always runs the eval first, then
#      compares against baseline; with --gate it exits 1 on regression
#      BEFORE writing the new baseline (cli.ts:90-93). One invocation =
#      one OpenAI billing run, not three.
#   2. If the run succeeded and `eval-baseline.json` actually changed,
#      open a PR (draft) so the operator can review the deltas before
#      merging. Direct push to master is intentionally avoided because
#      baseline shifts can hide real regressions if accepted blindly.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip baseline write + PR (only run eval + gate compare)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: eval-baseline-update
  cancel-in-progress: false

jobs:
  refresh-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Both secrets are checked BEFORE install/codegen. A missing
      # POSTGRES_URL used to surface as a full red run where every scenario
      # reported `PASS -> FAIL` plus a `preflight_env` blocking check — the
      # eval's own env preflight failing, which reads like a quality collapse
      # instead of a misconfigured job. Fail with the actual reason instead.
      #
      # Credentials are scoped per step rather than to the job (Codex P1 on
      # #631): a job-level `env:` hands the production DSN to `npm ci` (and its
      # postinstall scripts) and to the third-party create-pull-request action,
      # none of which need it. Only these three steps do.
      - name: Verify required secrets are present
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL_PROD }}
        run: |
          missing=""
          if [ -z "$OPENAI_API_KEY" ]; then
            missing="$missing OPENAI_API_KEY"
          fi
          if [ -z "$POSTGRES_URL" ]; then
            missing="$missing POSTGRES_URL_PROD"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing secret(s):$missing. Add them under Repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same dev/prod identity guard the prod-migration job uses: verify the
      # secret actually resolves to the prod Supabase project in
      # `config/db-targets.json` before the run spends LLM tokens. A secret
      # silently repointed at dev would otherwise produce a baseline scored
      # against an empty telemetry history. Sanitized output — never credentials.
      - name: Verify prod DB identity (db-targets guard)
        run: node scripts/db/check-db-env-target.mjs --expect=prod
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL_PROD }}

      # Single combined invocation: cli.ts always runs the eval + comparison;
      # `--gate` exits 1 on regression BEFORE the baseline write happens, and
      # `--save-baseline` writes only if we got past --gate. One run = one
      # OpenAI billing event (instead of three back-to-back runs).
      - name: Run eval + gate (and save baseline unless dry-run)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL_PROD }}
          DB_SSL_REJECT_UNAUTHORIZED: "false"
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npx tsx src/lib/gen/eval/cli.ts --gate
          else
            npx tsx src/lib/gen/eval/cli.ts --gate --save-baseline
          fi

      # `saveBaseline()` rewrites timestamp + per-prompt timings on every run, so
      # `git diff --quiet` would always report a change and the documented
      # no-op path could never happen (Codex P2 on #631). Compare the OUTCOME
      # instead: scores, pass/fail, blocking checks, file counts and the
      # non-timing summary fields.
      - name: Detect baseline change
        id: diff
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        run: |
          baseline=src/lib/gen/eval/eval-baseline.json
          git show "HEAD:$baseline" > /tmp/eval-baseline-previous.json
          changed=$(node scripts/eval/baseline-meaningful-change.mjs /tmp/eval-baseline-previous.json "$baseline")
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "false" ]; then
            echo "Baseline outcome unchanged (only run timestamp/timings differ) — no PR."
          fi

      - name: Open PR with refreshed baseline
        if: ${{ steps.diff.outputs.changed == 'true' }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(eval): refresh eval-baseline.json (auto-update)"
          branch: chore/eval-baseline-${{ github.run_id }}
          delete-branch: true
          title: "chore(eval): refresh eval-baseline.json"
          body: |
            Automated refresh of `src/lib/gen/eval/eval-baseline.json` after
            this eval run passed the gate.

            **Review checklist** before merging:
            - Does the new average score look right (no suspicious jumps)?
            - Any prompts that flipped PASS -> FAIL or FAIL -> PASS?
            - New blocking checks added vs. previous baseline?

            Trigger: ${{ github.event_name }}
            Run: ${{ github.run_id }}
          labels: |
            eval
            automated
          draft: true
