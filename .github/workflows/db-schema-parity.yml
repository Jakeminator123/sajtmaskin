name: DB schema parity (scheduled)

# Schemalagd drift-vakt: jämför de två LEVANDE databaserna (dev- och prod-
# Supabase) objekt för objekt — tabeller, kolumner, index, constraints — via
# `npm run db:schema-parity` (scripts/db/check-schema-parity.mjs). Read-only.
#
# Push-vägen täcks redan av `db-schema-parity`-jobbet i ci.yml (som dessutom
# auto-applicerar migrationer mot dev). Det här workflowet finns för driften
# DÄREMELLAN: en kolumn skapad direkt i Supabase-dashboarden, eller manuell
# DDL, syns annars först vid nästa trusted push. Rött = verklig skillnad; fixen
# är en migration i src/lib/db/migrations/ + MIGRATION_ORDER (aldrig mer
# dashboard-DDL), alternativt att objektet tas bort.
#
# GitHub `schedule` kör alltid workflow-filen från repositoryts DEFAULT BRANCH
# (här: `preview`). Därför får schemalagd körning INTE kräva
# `github.ref == refs/heads/master` — det hoppade över cron helt. Jobbet checkar
# i stället ut `master` (produktionens kanoniska träd) innan kontrollen körs.
#
# SÄKERHET: `workflow_dispatch` från annan ref än master nekas i ett separat
# rött jobb innan checkout eller secret-injektion. Schedule får köra, men
# secrets används bara i jobbet som checkar ut master-kod. Obetrodda feature-
# refs får aldrig live-secrets.

on:
  schedule:
    # Dagligen 04:37 UTC (udda minut för att undvika GitHubs heltimmes-rusning).
    - cron: "37 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reject-untrusted-manual-ref:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject secret-bearing dispatch outside master
        run: |
          echo "::error::Live schema-paritet med DB-secrets får bara dispatchas från refs/heads/master."
          exit 1

  db-schema-parity-scheduled:
    # schedule: defaultbranch tip (preview) hosts the workflow file — allow it.
    # workflow_dispatch: master only (reject job above fails other refs first).
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master (production canonical tree)
        uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Samma false-green-skydd som CI-jobben: på huvudrepot är saknade
      # secrets ett HÅRT fel; forkar (med cron aktiv av misstag) SKIP:ar.
      - name: Detect dev + prod credentials
        id: creds
        env:
          POSTGRES_URL_DEV: ${{ secrets.POSTGRES_URL_DEV }}
          POSTGRES_URL_PROD: ${{ secrets.POSTGRES_URL_PROD }}
        run: |
          if [ -n "$POSTGRES_URL_DEV" ] && [ -n "$POSTGRES_URL_PROD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.repository }}" = "Jakeminator123/sajtmaskin" ]; then
            echo "::error::POSTGRES_URL_DEV och/eller POSTGRES_URL_PROD saknas på huvudrepot — schema-paritet kan inte verifieras. Sätt dem: gh secret set POSTGRES_URL_DEV / POSTGRES_URL_PROD"
            exit 1
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DB-secrets saknas — hoppar över schema-paritet (fork)."
          fi

      - name: Live schema-parity gate dev↔prod (blocking, read-only)
        if: steps.creds.outputs.present == 'true'
        run: npm run db:schema-parity -- --require
        env:
          POSTGRES_URL_DEV: ${{ secrets.POSTGRES_URL_DEV }}
          POSTGRES_URL_PROD: ${{ secrets.POSTGRES_URL_PROD }}
