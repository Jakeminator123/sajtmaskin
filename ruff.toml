# Python-linter för backoffice. Körs med `npm run lint:py`.
#
# Varför filen finns: repot hade ingen Python-lint alls före 2026-08-11. ESLint
# täcker bara TypeScript, så oanvända importer i `backoffice/` kunde ligga kvar
# obemärkta (#872 rensade sex sådana för hand, hittade med en tillfälligt
# installerad pyflakes).
#
# Yta: `npm run lint:py` pekar explicit på `backoffice/`, kuratorns avgränsade
# Python-paket och `sajtmaskin_backoffice.py`. Att
# bredda den globala lintytan till hela `scripts/` är fortfarande en egen uppgift.
#
# Detta är INTE en required CI-check. Merge-grinden mot master är oförändrad.

target-version = "py313"

[lint]
# Medvetet liten start: `F` (pyflakes) hittar oanvända importer/variabler och
# namn som inte finns, `E9` fångar syntax- och tolkningsfel. Stil- och
# importsorteringsregler (`E4`, `E7`, `I`) är avsiktligt utanför — de ger stora
# diffar utan att hitta fel. Utöka när den här grunden hålls grön.
select = ["E9", "F"]

[lint.per-file-ignores]
# Fasadmodulerna (`backoffice/shared.py`, `pages/dossiers.py`,
# `pages/scaffold_lifecycle.py`) står medvetet INTE här: de deklarerar sina
# re-exporter i `__all__`, vilket både tystar F401 och dokumenterar avsikten.
#
# `dossiers_lib/*` är kvar som ignore. De mekaniska filsplittarna
# (#826/#837/#859) kopierade hela importblock till varje ny modul, så ~270 F401
# ligger där. De ser mekaniskt raderbara ut, men modulerna re-exporterar till
# varandra och når fasaden dynamiskt via `_facade()` — ett blint `ruff --fix`
# kan alltså bryta runtime utan att testerna märker det. Egen PR, en fil i
# taget; spårad i `BUG-SWARM-BACKLOG.md`.
"backoffice/pages/dossiers_lib/*.py" = ["F401"]
