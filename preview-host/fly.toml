# Fly app names need lowercase letters and hyphens.
app = "vm-fly-jakem"
primary_region = "arn"
# M#fly1: `npm install` OOM-dödades under parallella boots (Fly-loggar
# 2026-07-02). Swap gör att minnestoppar blir inbromsning i stället för
# dödade processer; grundorsaken (parallella installs) serialiseras i
# runtime.js (installQueue) och idle-runtimes stoppas av idle-reapern.
swap_size_mb = 2048

[build]
  dockerfile = "Dockerfile"

[[vm]]
  memory = "8gb"
  cpus = 4

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  PREVIEW_BASE_URL = "https://vm-fly-jakem.fly.dev"
  # Exact trust boundary for the always-on route bridge and inspector parents.
  # Public metadata, not a secret. First entry is the canonical inspect-script
  # source; the full list is allowed parent origins. Do not reorder as a fix.
  SAJTMASKIN_APP_ORIGINS = "https://sajtmaskin.vercel.app,https://sajtmaskin.se,https://www.sajtmaskin.se,https://sajtmaskin.com,https://www.sajtmaskin.com,https://sajtmaskin-git-preview-jakeminator123s-projects.vercel.app,https://preview.sajtmaskin.se"
  PREVIEW_SESSION_TTL_MS = "7200000"
  PREVIEW_HOST_DATA_DIR = "/data"
  # Package caches belong on the mounted volume, never the rootfs. The rootfs
  # is a ~8 GB ephemeral layer that no cleanup path reclaims; npm's default
  # cache (/root/.npm) filled it to 0 bytes free on 2026-07-31 and every
  # preview boot then died with ENOSPC (npm exit 228) while /data still had
  # 17 GB free. runtime.js sets the same values per spawned install; this entry
  # covers anything that runs outside that path and documents the invariant.
  #
  # Every key is the one its tool actually reads. `PNPM_STORE_DIR` is NOT a
  # pnpm variable (pnpm takes config from PNPM_CONFIG_*), and Yarn Berry
  # ignores YARN_CACHE_FOLDER because its global cache — enabled by default —
  # lives under YARN_GLOBAL_FOLDER. Both would have kept filling the rootfs.
  NPM_CONFIG_CACHE = "/data/package-caches/npm"
  PNPM_CONFIG_STORE_DIR = "/data/package-caches/pnpm"
  YARN_CACHE_FOLDER = "/data/package-caches/yarn"
  YARN_GLOBAL_FOLDER = "/data/package-caches/yarn-berry"
  # Corepack downloads the project-pinned package manager itself; `corepack
  # enable` runs in the Dockerfile, so this cache is live on every install.
  COREPACK_HOME = "/data/package-caches/corepack"
  # Back-stop for anything resolving its default through XDG — notably pnpm's
  # own default store ($XDG_DATA_HOME/pnpm/store) on versions that predate the
  # PNPM_CONFIG_* convention.
  XDG_DATA_HOME = "/data/package-caches/xdg-data"
  XDG_CACHE_HOME = "/data/package-caches/xdg-cache"
  PREVIEW_HOST_RUNTIME_READY_MAX_MS = "600000"
  # After next dev is spawned: fail splash if the port never accepts HTTP.
  # The 600s ceiling still covers install + a slow first compile that does listen.
  PREVIEW_HOST_RUNTIME_READY_CONNECT_MAX_MS = "90000"
  # Fast Edit Lane Fas 4: proxy Next dev HMR WebSocket to the runtime (true hot
  # reload, no iframe refresh). Reversible: set to "false" (or remove) + redeploy
  # to fall back to the no-op HMR stub. Default behaviour when unset is "off".
  SAJTMASKIN_PREVIEW_HMR_PROXY = "true"

[[mounts]]
  source = "preview_host_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # Guarantees no cold wake after a crash or deploy; auto_stop is already off.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    # Höjt från 10s → 20s så health-checken inte falsk-larmar när VM:en
    # är upptagen med npm install / boot för en ny preview. Tre missade i
    # rad markerar fortfarande VM som unhealthy, men marginalen räcker nu.
    timeout = "20s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
