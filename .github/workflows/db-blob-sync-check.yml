name: DB + Blob sync check

# Order/regression gate: verifies the dev + prod Supabase Postgres databases and
# the Vercel Blob store are in the expected state. Read-only. DEV is a used
# dev/preview scratch DB, so accumulated EMPTY-group rows there are an Advisory
# (WARN), not a fail; PROD carries live user data, so there the EMPTY-group row
# counts are informational (the old "prod is also empty" assumption was stale and
# kept this gate red on a used production DB — the same now applies to the
# actively-used dev DB). Both still enforce connectivity, schema, no drift,
# PRESERVED tables and parity. Runs scripts/db/pydatabastest.py --ci, which never prompts and
# exits non-zero on any FAIL. If a DB/blob secret is empty, that target is SKIPPED
# with a WARN so the job still passes meaningfully in forks / environments without
# prod credentials.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    # PR-körningen saknar live-creds och kan därför bara bevisa workflowets
    # egna Python-inputs. Schema/runtime ägs av required schema-drift i ci.yml.
    paths:
      - ".github/workflows/db-blob-sync-check.yml"
      - "requirements.dbtest.txt"
      - "scripts/db/**/*.py"
  workflow_dispatch: {}

concurrency:
  group: db-blob-sync-${{ github.ref }}
  cancel-in-progress: true

# Read-only check: needs no write scopes and no persisted git credentials.
permissions:
  contents: read

jobs:
  # En manuell körning från en feature-ref får varken checka ut refen eller nå
  # jobbet som har live-secrets. Gör felvalet synligt rött i stället för ett
  # tyst grönt workflow där den viktiga kontrollen aldrig kördes.
  reject-untrusted-manual-ref:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject secret-bearing dispatch outside master
        run: |
          echo "::error::DB + Blob sync med live-secrets får bara dispatchas från refs/heads/master."
          exit 1

  db-blob-sync:
    if: ${{ github.event_name == 'pull_request' || (github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Don't leave the GITHUB_TOKEN in git config while PR-controlled code runs.
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.dbtest.txt

      # Behavior tests for the gate's EMPTY-group decision logic (enforce/warn/info).
      # No DB or credentials needed, so they run on every triggered event,
      # including every PR that matches the executable-input allowlist above.
      - name: Run gate unit tests
        # `working-directory` puts scripts/db on sys.path, which is what lets the
        # test's `from pydatabastest import ...` resolve after the move out of the
        # repo root. The script itself is CWD-independent (see its REPO_ROOT).
        working-directory: scripts/db
        run: python -m unittest test_pydatabastest -v

      # SECURITY: production credentials are injected ONLY on trusted master events.
      # Både jobb- och steggrinden är avsiktligt explicita (defence in depth).
      # På pull_request kör ett separat steg utan secrets samma script.
      - name: Run DB + Blob sync gate (trusted events, with credentials)
        if: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: python scripts/db/pydatabastest.py --ci
        env:
          # The script tries the pooled (pooler.supabase.com) URL first, then direct.
          POSTGRES_URL_DEV: ${{ secrets.POSTGRES_URL_DEV }}
          POSTGRES_URL_PROD: ${{ secrets.POSTGRES_URL_PROD }}
          # Vercel Blob store token (store id must be sajtmaskin-blob / NHrq4GU42kcujMOV).
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # Supabase presents a self-signed cert chain; keep TLS verification relaxed.
          DB_SSL_REJECT_UNAUTHORIZED: "false"

      - name: Validate gate script (pull_request, no credentials)
        if: ${{ github.event_name == 'pull_request' }}
        # No secrets are injected here, so the PR's (untrusted) script can never run
        # with production credentials. Each DB/blob target SKIPs with a WARN; this step
        # only validates that the script parses and runs.
        run: python scripts/db/pydatabastest.py --ci
        env:
          DB_SSL_REJECT_UNAUTHORIZED: "false"
